[project]
name = "arche-backend"
version = "0.1.0"
description = "Backend API for the Arche exam-paper formatting service"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi[standard]>=0.116,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "pypdf>=6.19.0",
    "python-docx>=1.2,<2",
    "sqlalchemy>=2.0,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: requires TEST_DATABASE_URL pointing to PostgreSQL",
    "libreoffice: requires a working LibreOffice binary",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["docx", "docx.*"]
follow_imports = "skip"
ignore_missing_imports = true
